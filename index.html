<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="title"><h1>Dev Dashboard</h1></div>
         
            <div class="navigation">
                <ul id="menu">
                    <li id="home" class="active">Home</li>
                    <li class="">Skills</li>
                    <li class="">Projects</li>
                    <li class="">Experience</li>
                    <li class="">Education</li>
                    <li class="">Contact</li>
                </ul>
                <button id="export-btn">Export</button>
            </div>
        </div>
        <div class="right">
            <div class="top-bar">
                <ul id="top-menu">
                    <li>Settings</li>
                    <li>Notifications</li>
                    <li>Profile</li>
                </ul>
            </div>
            <div class="main">
                <section aria-labelledby="dashboard-stats-title">
                    <h2 id="dashboard-stats-title">Overview</h2>
                    <div class="cards">
                        <article id="projects-stat">
                            <h3>Projects</h3>
                            <p>0 Finished</p>
                            <p>2 In Progress</p>
                        </article>
                        <article id="skills-stat">
                        <h3>Skills</h3>
                        <p>I'm too lazy to count lol</p>
                        </article>
                        <article id="current-focus-stat">
                            <h3>Current focus</h3>
                            <p>September Full stack Speedrun</p>
                        </article>
                        <article id="progress-stat">
                            <h3>Progress</h3>
                            <p>3/30</p>
                        </article>
                    </div>
                </section>
            </div>   
        </div>
    </div>
</body>
</html>
